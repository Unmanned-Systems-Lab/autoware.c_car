/elevation_mapping_node:
    ros__parameters:
      map_frame: odom
      corrected_map_frame: odom
      base_frame: FP_POI  #vrtk_link
      initialize_frame_id: [FP_POI] #vrtk_link
      self_filter_enabled: true
      self_filter_min_x: -1.0
      self_filter_max_x: 0.2
      self_filter_min_y: -0.7
      self_filter_max_y: 0.7
      self_filter_min_z: -0.9
      self_filter_max_z: 0.2

      # Every fused cloud updates an unbounded sparse tile map. The 30 m
      # GridMap topic is only a detailed view; all tiles are retained on disk.
      enable_global_map: true
      global_map_storage_path: '~/.ros/elevation_mapping_cupy/global_tiles.sqlite3'
      global_map_resume_from_disk: false
      global_map_view_length_x: 30.0
      global_map_view_length_y: 30.0
      global_map_view_follow_robot: false

      subscribers:
        lidar:
          topic_name: /rslidar_points
          data_type: pointcloud

      publishers:
        elevation_map_raw:
          layers: [elevation, traversability, variance]
          basic_layers: [elevation]
          fps: 10.0

        elevation_map_filter:
          layers: [min_filter, smooth, near_base_filtered, despiked, inpaint,
          elevation]
          basic_layers: [min_filter, smooth, near_base_filtered, despiked,
          inpaint]
          fps: 10.0
